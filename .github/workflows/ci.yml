name: CI

# Pull requests only. A push to main runs deploy.yml, which builds the same way
# before shipping - running CI there too would mean two runs and two identical
# builds for one push.
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Typecheck
        run: npm test --if-present

      - name: Build
        run: npm run build
