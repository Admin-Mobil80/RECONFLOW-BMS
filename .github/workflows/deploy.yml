name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required for GitHub's OIDC token. Do not add long-lived AWS keys here.
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The infrastructure exists, so a missing variable is a real failure, not
      # something to skip past: a skipped job still reports green, which looks
      # exactly like a successful deploy. None of these values are secret, so
      # they are printed to make a misconfiguration obvious at a glance.
      # NOTE: these are repo VARIABLES, not secrets - ${{ vars.* }} cannot see
      # anything stored under the Secrets tab.
      - name: Check deploy configuration
        env:
          ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          BUCKET: ${{ vars.S3_BUCKET }}
          PREFIX: ${{ vars.S3_PREFIX }}
          DISTRIBUTION: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          echo "AWS_DEPLOY_ROLE_ARN       = ${ROLE_ARN:-<EMPTY>}"
          echo "S3_BUCKET                 = ${BUCKET:-<EMPTY>}"
          echo "S3_PREFIX                 = ${PREFIX:-<EMPTY>}"
          echo "CLOUDFRONT_DISTRIBUTION_ID= ${DISTRIBUTION:-<EMPTY>}"
          # Plain `if` blocks, not `[ -z "$X" ] && missing=...`: steps run under
          # `bash -e`, where an AND-OR list whose test is FALSE returns non-zero
          # and kills the step. That made this gate fail the moment all the
          # variables were correctly set - the exact opposite of what it checks.
          missing=""
          if [ -z "$ROLE_ARN" ]; then missing="$missing AWS_DEPLOY_ROLE_ARN"; fi
          if [ -z "$BUCKET" ]; then missing="$missing S3_BUCKET"; fi
          if [ -z "$PREFIX" ]; then missing="$missing S3_PREFIX"; fi
          if [ -n "$missing" ]; then
            echo "::error title=Deploy not configured::Missing repository variables:$missing - add them under Settings > Secrets and variables > Actions > the VARIABLES tab (repository scope, not Environment, not Secrets)."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: |
          npm ci

      - name: Build
        run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-1' }}

      - name: Sync to S3
        env:
          BUCKET: ${{ vars.S3_BUCKET }}
          PREFIX: ${{ vars.S3_PREFIX }}
          BUILD_DIR: ${{ vars.BUILD_DIR || 'dist' }}
        run: |
          if [ ! -d "$BUILD_DIR" ]; then
            echo "::error title=No build output::Expected '$BUILD_DIR'. Vite builds to dist; set the BUILD_DIR variable if that ever changes."
            exit 1
          fi
          # The bucket is shared with every other WingTheIdea web app, so the
          # destination is this app's folder and --delete never reaches a
          # sibling. The deploy role is scoped to the same prefix, so a wrong
          # S3_PREFIX fails with AccessDenied rather than touching another app.
          dest="s3://$BUCKET/${PREFIX%/}"
          echo "Deploying $BUILD_DIR to $dest"
          # Hashed assets cache hard; everything else must revalidate so a
          # deploy is visible immediately.
          aws s3 sync "$BUILD_DIR" "$dest" --delete \
            --exclude "*.html" --exclude "*.json" \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 sync "$BUILD_DIR" "$dest" --delete \
            --exclude "*" --include "*.html" --include "*.json" \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront
        if: vars.CLOUDFRONT_DISTRIBUTION_ID != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
